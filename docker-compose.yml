version: '3.8'

services:
  redust:
    build: .
    container_name: redust
    ports:
      - "6379:6379"
    volumes:
      - redust-data:/data
    environment:
      - REDUST_ADDR=0.0.0.0:6379
      - REDUST_RDB_PATH=/data/redust.rdb
      - REDUST_RDB_AUTO_SAVE_SECS=300
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "echo PING | nc -w 1 localhost 6379 | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  redust-data:
    driver: local
